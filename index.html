<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1715" />
    <title>Oscar Urbáez — Mobile Engineer</title>
    <meta
      name="description"
      content="Oscar Urbáez, mobile engineer en El Salvador. Desarrollo productos móviles con React Native y TypeScript."
    />

    <!-- Open Graph: cómo se ve al compartir el link -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oscar Urbáez — Mobile Engineer" />
    <meta
      property="og:description"
      content="Portafolio de Oscar Urbáez. Desarrollo móvil, React Native y productos digitales."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const dark = savedTheme
          ? savedTheme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#11121b"
          : "#e9e9e5";
      } catch {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#11121b"
          : "#e9e9e5";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
